# orz 2.0 — 示例 compose。平时不用敲命令：容器启动后自动监控。
services:
  orz:
    build: .
    container_name: orz
    restart: unless-stopped
    volumes:
      # 剧集目录（群晖 NAS 路径按实际情况改；带空格的路径要加引号）
      - "/volume1/TV show:/media/TV show"
      - "/volume1/Anime:/media/Anime"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?请在 .env 里设置 TMDB_API_KEY}
      TMDB_LANGUAGE: zh-CN
      # 监控目录用逗号分隔，带空格的路径不用转义，整个值加引号即可
      ORZ_WATCH_DIRS: "/media/TV show,/media/Anime"
      # ORZ_WATCH_MODE: "inotify"    # 事件驱动（默认）；"poll" 为轮询回落
      # ORZ_RESCAN_INTERVAL: "3600"  # 安全网全量复扫（秒），默认 0 关
      # ORZ_SCAN_INTERVAL: "30"        # 轮询模式间隔（秒），默认 30
      # ORZ_STABLE_SECONDS: "5"        # 文件大小不变几秒后才改名，默认 5
