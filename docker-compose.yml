# orz — compose 文件。先 cp .env.example .env 填好 TMDB_API_KEY，再：
#   docker compose up -d --build
# 平时不用敲命令：容器启动后自动监控。
services:
  orz:
    build: .
    container_name: orz
    restart: unless-stopped
    volumes:
      # 剧集目录：NAS 本地路径从 .env 读（NAS_TV_DIR / NAS_ANIME_DIR），
      # .env 里没有时回落到下面的默认值；冒号右边是容器内路径，别改。
      - "${NAS_TV_DIR:-/volume1/TV show}:/media/TV show"
      - "${NAS_ANIME_DIR:-/volume1/Anime}:/media/Anime"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?请在 .env 里设置 TMDB_API_KEY}
      TMDB_LANGUAGE: zh-CN
      # 监控目录用逗号分隔，带空格的路径不用转义，整个值加引号即可
      ORZ_WATCH_DIRS: "/media/TV show,/media/Anime"
      # ORZ_STABLE_SECONDS: "5"        # 文件大小不变几秒后才改名，默认 5
